# Cada item em "fontes" é um site. Para ligar um site novo, copie um bloco,
# troque o nome e ajuste. O guia completo dos campos está no README.md.

saida:
  pasta: dados            # onde os arquivos são gravados
  formatos: [csv, rds]    # csv (abre em qualquer lugar) e/ou rds (nativo do R)

fontes:

  # --- Site A: API pública, sem autenticação --------------------------------
  bcb:
    descricao: Banco Central do Brasil - Sistema Gerenciador de Séries (SGS)
    base_url: https://api.bcb.gov.br
    endpoints:
      selic:                                   # série 432: meta Selic
        caminho: /dados/serie/bcdata.sgs.432/dados
        params:
          formato: json
          dataInicial: 01/01/2020
      ipca:                                    # série 433: IPCA mensal
        caminho: /dados/serie/bcdata.sgs.433/dados
        params:
          formato: json
          dataInicial: 01/01/2020

  # --- Site B: IBGE (duas APIs do mesmo órgão) ------------------------------
  ibge:
    descricao: IBGE - localidades
    base_url: https://servicodados.ibge.gov.br
    endpoints:
      estados:
        caminho: /api/v1/localidades/estados

  ibge_sidra:
    descricao: IBGE - SIDRA (tabelas de pesquisas)
    base_url: https://apisidra.ibge.gov.br
    endpoints:
      ipca_12_meses:              # tabela 1737, variável 63 (variação mensal)
        caminho: /values/t/1737/n1/all/v/63/p/last%2012
        primeira_linha_cabecalho: true   # a SIDRA manda os títulos na 1ª linha

  # --- Site C: ANP (não tem API; publica arquivos CSV de dados abertos) ------
  anp:
    descricao: ANP - dados abertos (preços de combustíveis)
    base_url: https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/arquivos
    timeout_segundos: 600         # os arquivos são grandes
    endpoints:
      precos_combustiveis_2024_s1:
        caminho: /shpc/dsas/ca/ca-2024-01.csv
        formato_resposta: csv
        separador: ";"
        codificacao: latin1       # confira; se os acentos saírem errados, use UTF-8

